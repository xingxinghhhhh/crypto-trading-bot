schema_version: 1
policy_id: prospective_weekly_epoch_accumulation_v1
cadence: weekly
capture_weekday_utc: sunday
capture_window_start_utc: '10:00:00'
capture_window_end_utc: '11:00:00'
accepted_snapshot_policy: first_validator_complete_capture_in_window
max_accepted_snapshots_per_window: 1
retry_policy: transport_or_validation_failure_only_within_same_window
retry_after_valid_capture: false
missed_window_policy: record_missed_no_backfill
out_of_window_snapshot_policy: reject_for_accumulation
schedule_shift_after_miss: false
sample_maturity_threshold: 500
stop_condition: sample_maturity_met
early_stop_prohibited: true
result_driven_cadence_change_prohibited: true
result_driven_stop_change_prohibited: true
historical_backfill_prohibited: true
