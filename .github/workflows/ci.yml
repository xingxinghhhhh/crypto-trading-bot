name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Restore report-backed integration fixtures
        run: python tests/restore_ci_report_fixtures.py

      - name: Validate operations snapshot fixture closure
        run: python -m pytest tests/test_restore_ci_report_fixtures.py -q

      - name: Safety source scan
        run: python -m pytest tests/test_source_safety_scan.py tests/test_live_trading_guard.py -q

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy safety and research core
        run: >-
          python -m mypy --python-version ${{ matrix.python-version }}
          src/crypto_bot/config.py
          src/crypto_bot/cross_sectional_ic_calibration.py
          src/crypto_bot/cross_sectional_oos_stability.py
          src/crypto_bot/cross_sectional_portfolio_mechanism.py
          src/crypto_bot/cross_sectional_factor_research.py
          src/crypto_bot/errors.py
          src/crypto_bot/execution
          src/crypto_bot/factors.py
          src/crypto_bot/factor_research.py
          src/crypto_bot/market/archive_replay.py
          src/crypto_bot/market/dataset_panel.py
          src/crypto_bot/market/dataset_promotion.py
          src/crypto_bot/market/dataset_registry.py
          src/crypto_bot/market/okx_universe_intake.py
          src/crypto_bot/market/okx_universe_history_extension.py
          src/crypto_bot/market/okx_direct_six_asset_migration.py
          src/crypto_bot/market/public_response_mutability.py
          src/crypto_bot/market/direct_execution_mapping_audit.py
          src/crypto_bot/market/spread_application_semantics.py
          src/crypto_bot/prospective_economic_cost_scenario_contract.py
          src/crypto_bot/prospective_economic_readiness_gate.py
          src/crypto_bot/prospective_economic_sample_maturity_gate.py
          src/crypto_bot/market/prospective_evidence_operations_snapshot.py
          src/crypto_bot/market/prospective_evidence_operations_bundle.py
          src/crypto_bot/market/prospective_evidence_operations_bundle_admission.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_manifest.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_verification.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_delivery.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_delivery_admission.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_delivery_verification.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_read_model.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_freshness.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_consumer_projection.py
          src/crypto_bot/market/prospective_evidence_operations_handoff_consumer_projection_verification.py
          src/crypto_bot/prospective_epoch_accumulation_policy.py
          src/crypto_bot/prospective_epoch_assembly_state_machine.py
          src/crypto_bot/cross_sectional_variant_preregistration.py
          src/crypto_bot/market/execution_cost_evidence.py
          src/crypto_bot/market/okx_future_universe_archive.py
          src/crypto_bot/market/prospective_membership_bar_gate.py
          src/crypto_bot/market/prospective_direct_1h_extension.py
          src/crypto_bot/market/prospective_direct_1h_segment_chain.py
          src/crypto_bot/market/prospective_epoch_capture_admission.py
          src/crypto_bot/market/prospective_capture_attempt_journal.py
          src/crypto_bot/market/prospective_capture_attempt_receipt_chain.py
          src/crypto_bot/market/prospective_capture_attempt_evidence_adapter.py
          src/crypto_bot/market/prospective_capture_window_closeout.py
          src/crypto_bot/prospective_epoch_closeout_rollover.py
          src/crypto_bot/market/prospective_snapshot_transition_admission.py
          src/crypto_bot/market/prospective_snapshot_transition_materializer.py
          src/crypto_bot/market/prospective_membership_epoch_materializer.py
          src/crypto_bot/market/prospective_membership_epoch_closure.py
          src/crypto_bot/market/prospective_direct_1h_segment_admission.py
          src/crypto_bot/market/prospective_direct_1h_segment_evidence.py
          src/crypto_bot/market/prospective_direct_1h_segment_append_admission.py
          src/crypto_bot/market/prospective_direct_1h_segment_append_plan.py
          src/crypto_bot/market/prospective_direct_1h_segment_append_prepared.py
          src/crypto_bot/market/prospective_direct_1h_segment_append_preflight.py
          src/crypto_bot/market/prospective_direct_1h_segment_append_authorization.py
          src/crypto_bot/prospective_portfolio_ledger.py
          src/crypto_bot/prospective_economic_accounting_contract.py
          src/crypto_bot/market/legacy_timestamp_mapping_audit.py
          src/crypto_bot/market/timestamp_semantics.py
          src/crypto_bot/portfolio
          src/crypto_bot/promoted_cross_sectional_oos_evidence.py
          src/crypto_bot/promoted_cross_sectional_research.py
          src/crypto_bot/replay.py
          src/crypto_bot/risk
          src/crypto_bot/storage
          src/crypto_bot/strategy_benchmark.py

      - name: Tests and coverage
        run: python -m pytest tests -q --cov=crypto_bot --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.11
          path: coverage.xml
