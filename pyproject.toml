[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot"
version = "0.1.0"
description = "Safety-first cryptocurrency paper trading and backtesting MVP."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.0,<4.0",
  "numpy>=1.24,<3.0",
  "PyYAML>=6.0,<7.0",
  "ccxt>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.12,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
crypto-bot = "crypto_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["crypto_bot"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
