schema_version: 1

# This registry records evidence, not assumptions. `partial` means some lineage is
# preserved but the canonical file cannot be attributed to one provider end-to-end.
datasets:
  - dataset_id: btc_usdt_1h_v1
    symbol: BTC/USDT
    timeframe: 1h
    path: data/BTC_USDT_1h.csv
    source:
      status: partial
      providers:
        - binance_data_vision
        - okx_public_config
      evidence:
        - downloads/BTCUSDT-1h-2024-2026-05-15-binance-klines.csv
        - config.history.example.yaml
      note: Binance source files and an OKX append/import config both exist; end-to-end provenance is not proven.
    quality:
      validator: validate_ohlcv_csv
    expected:
      bar_count: 20784
      first_timestamp: "2024-01-01T00:00:00+00:00"
      last_timestamp: "2026-05-15T23:00:00+00:00"
